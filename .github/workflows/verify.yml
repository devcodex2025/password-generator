name: Verify

on:
  pull_request:
  push:
    branches: [next, main]

jobs:
  seo-locales:
    name: SEO locale coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate SEO locale maps
        run: npm run seo:locales

      - name: Run tests
        run: npm test
